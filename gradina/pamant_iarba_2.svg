<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Right face - dirt (lighter, warmer tone) -->
  <polygon points="50,50 100,25 100,75 50,100" fill="#B8743A"/>
  <!-- Right face highlight -->
  <polygon points="50,50 100,25 100,32 50,57" fill="#CC8A52" opacity="0.5"/>

  <!-- Left face - dirt (darker) -->
  <polygon points="0,25 50,50 50,100 0,75" fill="#8A5C2E"/>
  <!-- Left face shadow bottom -->
  <polygon points="0,68 50,93 50,100 0,75" fill="#6B4422" opacity="0.5"/>

  <!-- Dirt texture dots - left face -->
  <circle cx="18" cy="55" r="2" fill="#7A4E25" opacity="0.5"/>
  <circle cx="30" cy="70" r="1.5" fill="#7A4E25" opacity="0.4"/>
  <circle cx="12" cy="42" r="1.5" fill="#7A4E25" opacity="0.3"/>

  <!-- Dirt texture dots - right face -->
  <circle cx="72" cy="45" r="2" fill="#C4884A" opacity="0.5"/>
  <circle cx="85" cy="60" r="1.5" fill="#C4884A" opacity="0.4"/>
  <circle cx="78" cy="72" r="1.5" fill="#C4884A" opacity="0.3"/>

  <!-- Grass side strip - left (darker shade) -->
  <polygon points="0,25 50,50 50,57 0,32" fill="#4E9B4B"/>
  <!-- Grass side strip - right (darker shade) -->
  <polygon points="50,50 100,25 100,32 50,57" fill="#4E9B4B"/>

  <!-- Top face - grass (slightly darker variant) -->
  <polygon points="50,0 100,25 50,50 0,25" fill="#6BBF68"/>
  <!-- Grass highlight -->
  <polygon points="50,0 100,25 75,37 25,12" fill="#82D47F" opacity="0.35"/>

  <!-- Small grass tufts on top -->
  <line x1="30" y1="18" x2="28" y2="11" stroke="#4E9B4B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="33" y1="16" x2="33" y2="9" stroke="#4E9B4B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="22" x2="60" y2="15" stroke="#4E9B4B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="20" x2="65" y2="13" stroke="#4E9B4B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Outline -->
  <polygon points="50,0 100,25 50,50 0,25" fill="none" stroke="#3D7B3A" stroke-width="1.2" stroke-linejoin="round"/>
  <polyline points="0,25 0,75 50,100 100,75 100,25" fill="none" stroke="#6B4422" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="50" y1="50" x2="50" y2="100" stroke="#6B4422" stroke-width="1" opacity="0.6"/>
</svg>
